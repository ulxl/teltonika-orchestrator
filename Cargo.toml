[package]
name = "rust-app"
version = "1.2.0"
edition = "2024"
authors = ["Hilmy <https://github.com/ulxl>"]
description = "High-Performance Teltonika Fleet Automation Engine built with Rust, Tokio, Axum & Wry."
license = "MIT"
repository = "https://github.com/ulxl/teltonika-orchestrator"

[lib]
name = "rust_app"
path = "src/lib.rs"

[[bin]]
name = "rust-app"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
rust_xlsxwriter = "0.84"
open = "5"
russh = "0.49"
russh-sftp = "2"
wry = "0.47"
tao = "0.30"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
chrono = "0.4"
async-trait = "0.1"
ssh-key = "0.6"
base64 = "0.22"
rfd = "0.17.2"
